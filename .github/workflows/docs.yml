name: Docs

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  docs:
    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm run docs
