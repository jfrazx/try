name: Typecheck

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  typecheck:
    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
